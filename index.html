<div id="app"></div>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var mem={};
function store(k,v){if(v===undefined){var x=ls(k);return x||mem[k]||null}mem[k]=v;ls(k,v)}
var hash=function(s){var h=5381;for(var i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return String(h>>>0)};
var today=function(){return new Date().toISOString().slice(0,10)};
var fmt=function(n){return Number(n||0).toLocaleString("id-ID")};
var rp=function(n){return "Rp"+fmt(n)};
var fd=function(d){return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})};

var DEF=[

["Kampas rem",10000,12],["Rantai / V-belt",12000,12],["Aki",0,24],["Ban",15000,24]];
var CHECK=["Tekanan angin ban","Level oli mesin","Fungsi rem depan & belakang","Lampu & sein","Kondisi rantai / belt","Bensin cukup"];

var user=null,D=null,tab="home",mode="login";
function load(){D=store("rm_data_"+user);if(D&&D.bike){D.fuel=D.fuel||[];D.docs=D.docs||[];D.shops=D.shops||[];D.prices=D.prices||[];D.issues=D.issues||[];delete D.chat}}
function save(){if(D&&D.bike&&D.lastOdo!==D.bike.odo){D.hist=(D.hist||[]).concat([{d:today(),k:D.bike.odo}]).slice(-60);D.lastOdo=D.bike.odo}store("rm_data_"+user,D)}

function status(it){
  var kmP=it.km?(D.bike.odo-it.lastKm)/it.km:0;
  var dP=it.months?((Date.now()-new Date(it.lastDate))/864e5)/(it.months*30):0;
  var p=Math.max(kmP,dP);
  var st=p>=1?"over":p>=.85?"soon":"ok";
  var kmL=it.km?it.lastKm+it.km-D.bike.odo:null;
  var dL=it.months?Math.round(it.months*30-(Date.now()-new Date(it.lastDate))/864e5):null;
  return{p:p,st:st,kmL:kmL,dL:dL};
}
function score(){var s=D.items.map(function(i){return{ok:100,soon:60,over:15}[status(i).st]});return Math.round(s.reduce(function(a,b){return a+b},0)/s.length)}
var LBL={ok:"Aman",soon:"Segera",over:"Terlambat"},COL={ok:"var(--ok)",soon:"var(--wa)",over:"var(--er)"};

function render(){
  var a=$("#app");syncHash();
